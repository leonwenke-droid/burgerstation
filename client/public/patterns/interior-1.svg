<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="wallPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8FB8"/>
      <stop offset="100%" stop-color="#E66494"/>
    </linearGradient>
    <filter id="neonGlow1">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonGlowStrong">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Wall -->
  <rect width="600" height="600" fill="url(#wallPink)"/>
  <!-- subtle texture -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="600" y2="100" stroke="#FAFAF6" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#FAFAF6" stroke-width="1"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#FAFAF6" stroke-width="1"/>
    <line x1="0" y1="400" x2="600" y2="400" stroke="#FAFAF6" stroke-width="1"/>
    <line x1="0" y1="500" x2="600" y2="500" stroke="#FAFAF6" stroke-width="1"/>
  </g>

  <!-- Floor checkerboard -->
  <g>
    <rect x="0" y="500" width="600" height="100" fill="#1a1a1a"/>
    <g fill="#FAFAF6">
      <rect x="0" y="500" width="60" height="50"/>
      <rect x="120" y="500" width="60" height="50"/>
      <rect x="240" y="500" width="60" height="50"/>
      <rect x="360" y="500" width="60" height="50"/>
      <rect x="480" y="500" width="60" height="50"/>
      <rect x="60" y="550" width="60" height="50"/>
      <rect x="180" y="550" width="60" height="50"/>
      <rect x="300" y="550" width="60" height="50"/>
      <rect x="420" y="550" width="60" height="50"/>
      <rect x="540" y="550" width="60" height="50"/>
    </g>
  </g>

  <!-- Big neon BURGER sign -->
  <g transform="translate(300 230)">
    <!-- frame -->
    <rect x="-200" y="-110" width="400" height="220" fill="#0a1530" stroke="#FAFAF6" stroke-width="3" rx="8"/>
    <rect x="-195" y="-105" width="390" height="210" fill="none" stroke="#FF2D87" stroke-width="2" filter="url(#neonGlow1)" rx="6"/>

    <!-- Burger Station text -->
    <text x="0" y="-30" font-family="'Bebas Neue', sans-serif" font-size="60" fill="#FF2D87" text-anchor="middle" letter-spacing="4" filter="url(#neonGlowStrong)">BURGER</text>
    <text x="0" y="40" font-family="'Bebas Neue', sans-serif" font-size="60" fill="#00E0E0" text-anchor="middle" letter-spacing="4" filter="url(#neonGlowStrong)">STATION</text>

    <!-- Tagline -->
    <text x="0" y="80" font-family="'Bebas Neue', sans-serif" font-size="20" fill="#FFE15D" text-anchor="middle" letter-spacing="3" filter="url(#neonGlow1)">~ GREAT TASTE ~</text>
  </g>

  <!-- US License Plate decoration -->
  <g transform="translate(80 380) rotate(-8)">
    <rect x="-50" y="-30" width="100" height="60" fill="#FAFAF6" stroke="#1a1a1a" stroke-width="3" rx="4"/>
    <text x="0" y="-8" font-family="'Bebas Neue', sans-serif" font-size="10" fill="#FF2D87" text-anchor="middle" letter-spacing="1">CALIFORNIA</text>
    <text x="0" y="20" font-family="'Bebas Neue', sans-serif" font-size="22" fill="#0a1530" text-anchor="middle" letter-spacing="3">LEER 26789</text>
  </g>

  <!-- Vinyl record -->
  <g transform="translate(520 380)">
    <circle r="48" fill="#1a1a1a" stroke="#FAFAF6" stroke-width="2"/>
    <circle r="42" fill="none" stroke="#3a3a3a" stroke-width="1"/>
    <circle r="36" fill="none" stroke="#3a3a3a" stroke-width="1"/>
    <circle r="30" fill="none" stroke="#3a3a3a" stroke-width="1"/>
    <circle r="14" fill="#FF2D87"/>
    <circle r="3" fill="#1a1a1a"/>
  </g>

  <!-- Stars -->
  <g fill="#FFE15D" filter="url(#neonGlow1)">
    <polygon points="120,80 124,68 128,80 140,84 128,88 124,100 120,88 108,84"/>
    <polygon points="500,90 506,78 510,90 522,94 510,98 506,110 500,98 488,94"/>
  </g>
</svg>
